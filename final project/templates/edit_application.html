{% extends "base.html" %}

{% block title %}Edit Application - InternTrack{% endblock %}

{% block content %}
<div class="form-page">
    <h1>Edit Application</h1>
    <p class="subtitle">Update your application details</p>

    <div class="form-container">
        <form method="POST" class="form">
            <div class="form-group">
                <label for="company">Company Name</label>
                <input type="text" id="company" name="company" value="{{ application.company }}" required>
            </div>

            <div class="form-group">
                <label for="role">Job Role/Position</label>
                <input type="text" id="role" name="role" value="{{ application.role }}" required>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" value="{{ application.location }}">
            </div>

            <div class="form-group">
                <label for="date_applied">Date Applied</label>
                <input type="date" id="date_applied" name="date_applied" value="{{ application.date_applied }}">
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    {% for status in statuses %}
                        <option value="{{ status }}" {% if status == application.status %}selected{% endif %}>{{ status }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Application</button>
                <a href="{{ url_for('view_applications') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
